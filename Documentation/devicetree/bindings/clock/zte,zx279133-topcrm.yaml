%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/zte,zx279133-topcrm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279133 top clock and reset manager

maintainers:
  - cnjn <1779895255@qq.com>

description:
  The top clock and reset manager (TOPCRM) gates clocks supplied to the
  ZX279133 low-speed peripheral clock controllers. The current binding exposes
  the subset needed for the UART and watchdog timers.

properties:
  compatible:
    items:
      - const: zte,zx279133-topcrm
      - const: syscon

  reg:
    maxItems: 1

  clocks:
    items:
      - description: 100 MHz LSP working clock source
      - description: 25 MHz oscillator
      - description: 125 MHz system peripheral bus clock
      - description: 32.768 kHz LSP working clock source

  clock-names:
    items:
      - const: clk100m
      - const: clk25m
      - const: pclk
      - const: clk32k

  '#clock-cells':
    const: 1
    description:
      See include/dt-bindings/clock/zte,zx279133-topcrm.h for valid indices.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@10e10000 {
        compatible = "zte,zx279133-topcrm", "syscon";
        reg = <0x10e10000 0x10000>;
        clocks = <&clk100m>, <&osc25m>, <&clk125m>, <&clk32k>;
        clock-names = "clk100m", "clk25m", "pclk", "clk32k";
        #clock-cells = <1>;
    };

...
