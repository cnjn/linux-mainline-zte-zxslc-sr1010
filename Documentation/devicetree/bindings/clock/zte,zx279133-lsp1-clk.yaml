%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/zte,zx279133-lsp1-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279133 LSP1 clock and reset controller

maintainers:
  - cnjn <1779895255@qq.com>

description:
  The LSP1 clock controller supplies bus and working clocks to the ZX279133
  watchdog timers, efuse controller, PWM controller, and MDIO controllers. Each
  watchdog working clock has a 10-bit linear divider followed by a gate. Each
  MDIO working clock has a read-only 7-bit linear divider followed by a gate.
  The efuse and PWM peripheral and working clocks each have a gate. The
  controller also provides the MDIO reset lines.

properties:
  compatible:
    const: zte,zx279133-lsp1-clk

  reg:
    maxItems: 1

  clocks:
    items:
      - description: LSP1 peripheral bus clock
      - description: 32.768 kHz watchdog working clock
      - description: 25 MHz efuse working clock
      - description: 100 MHz MDIO working clock source

  clock-names:
    items:
      - const: pclk
      - const: wclk32k
      - const: wclk25m
      - const: wclk100m

  '#clock-cells':
    const: 1
    description:
      See include/dt-bindings/clock/zte,zx279133-lsp.h for valid indices.

  '#reset-cells':
    const: 1
    description:
      See include/dt-bindings/reset/zte,zx279133-lsp.h for valid indices.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/zte,zx279133-topcrm.h>

    clock-controller@14f00000 {
        compatible = "zte,zx279133-lsp1-clk";
        reg = <0x14f00000 0x100>;
        clocks = <&topcrm ZX279133_TOPCRM_CLK_LSP1_PCLK>,
                 <&topcrm ZX279133_TOPCRM_CLK_LSP1_32K>,
                 <&topcrm ZX279133_TOPCRM_CLK_LSP1_25M>,
                 <&topcrm ZX279133_TOPCRM_CLK_LSP1_100M>;
        clock-names = "pclk", "wclk32k", "wclk25m", "wclk100m";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };

...
