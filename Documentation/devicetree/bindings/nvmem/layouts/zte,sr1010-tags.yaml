%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/layouts/zte,sr1010-tags.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE SR1010 factory tags

maintainers:
  - Linux ARM Kernel Mailing List <linux-arm-kernel@lists.infradead.org>

description: |
  The tags partition contains a little-endian header with magic 0x33333333,
  payload length and IEEE CRC32 of the payload. Each payload record contains
  four little-endian 32-bit words (key length, value length, two reserved
  words), followed by the key and value without alignment padding. The
  two-byte keys 0x0100 and 0x0101 identify six-byte Ethernet MAC addresses.
  The MAC offset is discovered by parsing records, rather than fixed in DT.

select: false

properties:
  compatible:
    const: zte,sr1010-tags

  mac-address:
    type: object
    description: MAC from tag 0x0100, assigned to WAN on SR1010.
    additionalProperties: false

  mac-address-lan:
    type: object
    description: MAC from tag 0x0101, assigned to LAN on SR1010.
    additionalProperties: false

required:
  - compatible

additionalProperties: false

examples:
  - |
    nvmem-layout {
        compatible = "zte,sr1010-tags";

        mac-address {
        };
    };
