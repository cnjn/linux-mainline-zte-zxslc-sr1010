%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/zte,zx296718-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX296718 reset controller

maintainers:
  - cnjn <1779895255@qq.com>

description:
  The ZTE ZX296718 reset controller provides active-low reset signals to SoC
  peripherals. Each reset line is controlled by one bit in a bank of 32-bit
  registers.

properties:
  compatible:
    const: zte,zx296718-reset

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1
    description: Bit index of the reset signal within the register bank

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    reset-controller@10e10060 {
        compatible = "zte,zx296718-reset";
        reg = <0x10e10060 0x4>;
        #reset-cells = <1>;
    };

...
