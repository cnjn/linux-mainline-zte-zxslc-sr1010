%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/zte,zx279133-wdt-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279133 watchdog reset routing register

maintainers:
  - cnjn <1779895255@qq.com>

description:
  The four-byte watchdog reset routing register enables each watchdog timer's
  reset output. It is exposed as a syscon so the watchdog driver can configure
  its corresponding route without mapping unrelated TOPCRM registers.

properties:
  compatible:
    items:
      - const: zte,zx279133-wdt-reset
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@10e10208 {
        compatible = "zte,zx279133-wdt-reset", "syscon";
        reg = <0x10e10208 0x4>;
    };

...
