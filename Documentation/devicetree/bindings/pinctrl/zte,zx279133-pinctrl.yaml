# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/zte,zx279133-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279133 pin controller

maintainers:
  - ZTE Linux Team <zte.linux@gmail.com>

description: |
  The ZX279133 pin controller contains 70 pins in six physical pin banks.
  This binding describes GPIO muxing, the SPI flash controller pins, and the
  PWM outputs. Other peripheral mux selections established by firmware remain
  unchanged.

properties:
  compatible:
    const: zte,zx279133-pinctrl

  reg:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    $ref: pinmux-node.yaml#
    additionalProperties: false

    properties:
      function:
        enum: [gpio, pwm, spifc]

      pins:
        minItems: 1
        maxItems: 70
        items:
          enum:
            - p0-0
            - p0-1
            - p0-2
            - p0-3
            - p0-4
            - p0-5
            - p0-6
            - p0-7
            - p0-8
            - p0-9
            - p0-10
            - p0-11
            - p0-12
            - p0-13
            - p0-14
            - p1-0
            - p1-1
            - p1-2
            - p1-3
            - p1-4
            - p1-5
            - p1-6
            - p1-7
            - p1-8
            - p1-9
            - p2-0
            - p2-1
            - p2-2
            - p2-3
            - p2-4
            - p2-5
            - p2-6
            - p2-7
            - p2-8
            - p2-9
            - p2-10
            - p2-11
            - p2-12
            - p2-13
            - p2-14
            - p2-15
            - p2-16
            - p2-17
            - p3-0
            - p3-1
            - p3-2
            - p3-3
            - p3-4
            - p3-5
            - p3-6
            - p3-7
            - p3-8
            - p3-9
            - p3-10
            - p3-11
            - p3-12
            - p4-0
            - p4-1
            - p4-2
            - p4-3
            - p4-4
            - p4-5
            - p4-6
            - p4-7
            - p4-8
            - p4-9
            - p5-0
            - p5-1
            - p5-2
            - p5-3

    allOf:
      - if:
          properties:
            function:
              const: spifc
        then:
          properties:
            pins:
              items:
                enum: [p3-9, p3-10, p3-11, p3-12, p4-0, p4-1]
      - if:
          properties:
            function:
              const: pwm
        then:
          properties:
            pins:
              items:
                enum: [p0-8, p0-9, p0-12, p0-13]

    required:
      - function
      - pins

required:
  - compatible
  - reg

allOf:
  - $ref: pinctrl.yaml#

additionalProperties: false

examples:
  - |
    pinctrl@10e20000 {
        compatible = "zte,zx279133-pinctrl";
        reg = <0x10e20000 0x1000>;

        example-pins {
            function = "spifc";
            pins = "p3-9", "p3-10", "p3-11", "p3-12", "p4-0", "p4-1";
        };

        pwm-pins {
            function = "pwm";
            pins = "p0-9";
        };
    };
